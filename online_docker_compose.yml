#    environment:
#      - PYTHONUNBUFFERED=1
#      - PW=/run/secrets/pw
#      - EXAMPLE_USER_PW=/run/secrets/example_user_pw
#      - DB_HOST=mysql
#      - DOCKERIZED=1
#    env_file:
