secrets:
  pw:
    file: ./secrets/secret.txt
  mail_pw:
    file: ./secrets/mail_secret.txt
  key_for_token:
    file: ./secrets/key_for_token.txt
  example_user_pw:
    file: ./secrets/example_user_secret.txt

networks:
  pps_network: